name: Hydrate GTA VI site versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hydrate.yml

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify original archives
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/v1_00.b64 .staging/v1_rest.b64 > /tmp/v1.b64
          cat .staging/v2_00.b64 .staging/v2_01.b64 .staging/v2_02.b64 > /tmp/v2.b64
          base64 --decode /tmp/v1.b64 > /tmp/v1.zip
          base64 --decode /tmp/v2.b64 > /tmp/v2.zip
          unzip -t /tmp/v1.zip
          unzip -t /tmp/v2.zip

      - name: Materialize versioned source and archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions/v1 versions/v2 archives
          unzip -p /tmp/v1.zip gta6_cinematic_site/README.md > versions/v1/README.md
          unzip -p /tmp/v1.zip gta6_cinematic_site/index.html > versions/v1/index.html
          unzip -p /tmp/v2.zip gta6_cinematic_site_v2/README.md > versions/v2/README.md
          unzip -p /tmp/v2.zip gta6_cinematic_site_v2/index.html > versions/v2/index.html
          unzip -p /tmp/v2.zip gta6_cinematic_site_v2/styles.css > versions/v2/styles.css
          unzip -p /tmp/v2.zip gta6_cinematic_site_v2/app.js > versions/v2/app.js
          cp /tmp/v1.zip archives/GTA6_Cinematic_Fan_Concept_v1.zip
          cp /tmp/v2.zip archives/GTA6_Cinematic_Fan_Concept_v2.zip

      - name: Commit clean archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging
          rm -f .github/workflows/hydrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete GTA VI Web V1 and V2 source archives"
          git push origin HEAD:main
